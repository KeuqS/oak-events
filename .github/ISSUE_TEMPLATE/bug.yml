name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** attach camera images, depth maps,
        IP addresses, hostnames or device ids. Event lines are fine once you have
        removed anything you consider private.
        Security issues: use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: oak-events doctor output
      description: Output of `oak-events doctor` (redact device ids if you like).
      render: text
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Camera
      options:
        - OAK-D (USB, RVC2)
        - OAK-D PoE (RVC2)
        - Other RVC2
        - RVC4
        - No camera (logic / MCP / CLI issue)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: e.g. Ubuntu 24.04, Python 3.12
    validations:
      required: true
  - type: textarea
    id: events
    attributes:
      label: Relevant event lines or logs
      render: text
