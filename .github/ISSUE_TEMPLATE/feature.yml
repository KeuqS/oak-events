name: Feature request
description: Suggest a new event kind, tool or integration
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        oak-events has one hard rule: no pictures leave the camera. Features that
        would send or store frames (snapshots, thumbnails, crops, video) are out of
        scope.
  - type: textarea
    id: problem
    attributes:
      label: What do you want an agent to know?
      description: The question the event or tool should answer.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed event / tool
      description: Event kind and fields, or tool name and output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This feature works from detections and/or coarse depth only, without frames reaching the host.
          required: true
